<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portafolio - Sin espacio con cursor personalizado</title>
  <!-- Fuente Montserrat y Special Elite -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&family=Special+Elite&display=swap" rel="stylesheet" />
<style>
  /* ... tu CSS sin cambios ... */
</style>

</head>
<body>
<div id="categories-bar">
  <div class="top-bar">
    <div class="name-label">
      <a href="https://madximiliano.com" style="color: #ffffff; text-decoration: none;">Maximiliano Vásquez</a>
    </div>
   <button class="hamburger" id="hamburgerBtn">•</button>
  </div>

  <div class="buttons-container" id="mobileMenu">
    <button><a href="https://madximiliano.com" style="color: #ffffff; text-decoration: none;">index</a></button>
    <button><a href="https://madximiliano.com" style="color: #ffffff; text-decoration: none;">Commercial</a></button>
    <button><a href="https://madximiliano.com" style="color: #ffffff; text-decoration: none;">Info</a></button>
    <button><a href="https://madximiliano.com" style="color: #ffffff; text-decoration: none;">follow</a></button>
  </div>
</div>

  <div class="image-grid" aria-label="Galería de imágenes">
    <!-- tus imágenes aquí sin cambios -->
  </div>

<script>
  const hamburgerBtn = document.getElementById("hamburgerBtn");
  const mobileMenu = document.getElementById("mobileMenu");

  hamburgerBtn.addEventListener("click", () => {
    mobileMenu.classList.toggle("show");
  });

  // Oculta menú si cambia a escritorio
  window.addEventListener("resize", () => {
    if (window.innerWidth > 768) {
      mobileMenu.classList.remove("show");
    }
  });

  // Redirigir al inicio al hacer clic en cualquier parte de la página
  document.body.addEventListener('click', function(e) {
    // Evitar que los enlaces funcionen normalmente para forzar redirección
    e.preventDefault();
    window.location.href = 'https://madximiliano.com';
  });
</script>
</body>
</html>
