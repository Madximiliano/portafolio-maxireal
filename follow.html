<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portafolio - Sin espacio con cursor personalizado</title>
  <!-- Fuente Montserrat y Special Elite -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&family=Special+Elite&display=swap" rel="stylesheet" />
<style>
  /* ... tu CSS sin cambios ... */
</style>
</head>
<body>
<div id="categories-bar">
  <div class="top-bar">
    <div class="name-label">
      <a href="https://madximiliano.com" style="color: #ffffff; text-decoration: none;">Maximiliano Vásquez</a>
    </div>
    <button class="hamburger" id="hamburgerBtn">•</button>
  </div>

  <div class="buttons-container" id="mobileMenu">
    <a href="https://madximiliano.com" style="color: #ffffff; text-decoration: none;">index</a>
    <a href="https://madximiliano.com" style="color: #ffffff; text-decoration: none;">Commercial</a>
    <a href="https://madximiliano.com" style="color: #ffffff; text-decoration: none;">Info</a>
    <!-- follow directo a IG -->
    <a href="https://www.instagram.com/madximiliano" id="followLink" style="color: #ffffff; text-decoration: none;">follow</a>
  </div>
</div>

<div class="image-grid" aria-label="Galería de imágenes">
  <!-- tus imágenes aquí sin cambios -->
</div>

<script>
  const hamburgerBtn = document.getElementById("hamburgerBtn");
  const mobileMenu = document.getElementById("mobileMenu");

  hamburgerBtn.addEventListener("click", () => {
    mobileMenu.classList.toggle("show");
  });

  // Oculta menú si cambia a escritorio
  window.addEventListener("resize", () => {
    if (window.innerWidth > 768) {
      mobileMenu.classList.remove("show");
    }
  });

  // Redirección directa al hacer click en "follow"
  document.getElementById("followLink").addEventListener("click", function(e) {
    e.preventDefault();
    window.location.href = "https://www.instagram.com/madximiliano";
  });
</script>
</body>
</html>
