      font-weight:400;
      background:none;
      border:none;
      color:#ffffff;
      cursor:pointer;
      padding:8px 16px;
      border-bottom:2px solid transparent;
      transition:border-color 0.3s ease;
      text-align:center;

    #categories-bar button:hover, #categories-bar button:focus { border-color:#000; outline:none; }
    #categories-bar button.active { border-color:#000; font-weight:400; }

    .image-grid { display:grid; grid-template-columns:1fr; gap:0; margin:0; padding:0; width:100vw; }
    .image-large, .image-small { width:100%; height:100%; object-fit:cover; border-radius:0 !important; display:block; }

      .hamburger { display:block !important; font-size:2rem; background:transparent; color:white; border:none; cursor:pointer; z-index:1100; }
      .buttons-container button { width:100%; text-align:left; padding-left:24px; }
