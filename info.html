<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Info</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    /* FIX DEL MENÚ HAMBURGUESA */
    @media (max-width:768px) {
      #categories-bar { 
        flex-direction: row; 
        align-items: center; 
        padding: 12px 16px; 
        height: auto; 
        gap: 8px; 
      }

      #categories-bar .buttons-container {
        display: none;
        flex-direction: column;
        background-color: transparent;
        width: 100%;
        position: absolute;
        top: 40px;
        right: 0;
        padding: 10px 0;
        z-index: 1000;
        margin-right: 0;
      }

      #categories-bar .buttons-container.show {
        display: flex !important;
      }

      .hamburger {
        display: block !important;
        font-size: 2rem;
        background: transparent;
        color: #ccc;
        border: none;
        cursor: pointer;
        z-index: 1100;
      }

      .buttons-container button {
        width: 100%;
        text-align: left;
        padding-left: 24px;
      }
    }

    @media (min-width:769px) {
      .hamburger { display: none !important; }
      .buttons-container { display: flex !important; }
    }
  </style>
</head>
<body>
  <header>
    <nav id="categories-bar">
      <button class="hamburger" onclick="toggleMenu()">&#x25CF;</button>
      <div class="buttons-container">
        <button onclick="location.href='index.html'">Home</button>
        <button onclick="location.href='commercial.html'">Commercial</button>
        <button onclick="location.href='editorial.html'">Editorial</button>
        <button onclick="location.href='info.html'">Info</button>
        <button onclick="location.href='contact.html'">Contact</button>
      </div>
    </nav>
  </header>

  <main>
    <h1>Info</h1>
    <p>Aquí va tu contenido de la página de info...</p>
  </main>

  <script>
    function toggleMenu() {
      document.querySelector('.buttons-container').classList.toggle('show');
    }
  </script>
</body>
</html>
