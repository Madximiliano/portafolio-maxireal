<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Información - Maximiliano Vásquez</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300&family=Special+Elite&display=swap" rel="stylesheet" />
<style>
  @font-face {
    font-family: 'NeueHaasDisplay';
    src: url('fonts/NeueHaasDisplayMediu.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    background: #000;
    color: #ccc;
    line-height: 1.2;
    padding: 2rem 1rem 2rem;
    max-width: 900px;
    margin: 0 auto;
    font-size: 0.7rem;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 2rem;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  a,
  #categories-bar .name-label,
  #categories-bar button,
  .contact-info a {
    color: #ccc !important;
    text-decoration: none;
    font-family: 'NeueHaasDisplay', sans-serif !important;
  }

  #categories-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: transparent;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    z-index: 1000;
    height: 40px;
    width: 100vw;
    max-width: 100vw;
    user-select: none;
  }

  /* Nombre un pelito más a la izquierda */
  #categories-bar .name-label {
    font-family: 'NeueHaasDisplay', sans-serif !important;
    font-weight: 400;
    font-size: 1rem;
    white-space: nowrap;
    text-align: left;
    flex-shrink: 0;
    margin-left: 18px; /* <- ajustado */
    color: #ccc;
    text-decoration: none;
  }

  #categories-bar .buttons-container {
    display: flex;
    gap: 24px;
    justify-content: flex-end;
    flex: 1;
    margin-right: 24px;
  }

  #categories-bar button {
    font-family: 'NeueHaasDisplay', sans-serif !important;
    font-size: 0.6rem;
    font-weight: 400;
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px 16px;
    border-bottom: 2px solid transparent;
    transition: border-color 0.3s ease;
    text-align: center;
    color: #ccc;
  }

  #categories-bar button:hover,
  #categories-bar button:focus,
  #categories-bar button.active {
    border-color: #ccc;
    outline: none;
    font-weight: 400;
  }

  #categories-bar a {
    color: #ccc !important;
    text-decoration: none !important;
    font-family: 'NeueHaasDisplay', sans-serif !important;
    font-weight: 400;
    font-size: 0.6rem;
    padding: 8px 16px;
    display: inline-block;
  }

  /* Titulos con NeueHaasDisplay */
  h1, h2 {
    font-family: 'NeueHaasDisplay', sans-serif !important;
    font-weight: 400;
    margin: 0 0 0.5rem 0;
    color: #ccc;
    text-align: left;
  }

  /* Contenido texto en Montserrat */
  .box p {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    margin-top: 0;
    margin-bottom: 1rem;
    text-align: justify;
    color: #ccc;
    font-size: 0.7rem;
  }

  .text-columns {
    display: flex;
    gap: 3rem;
    max-width: 900px;
    width: 100%;
    justify-content: center;
    padding-top: 3rem;
    box-sizing: border-box;
  }
  .text-column {
    flex: 1;
    max-width: 45%;
  }

  @media (max-width: 768px) {
    .text-columns {
      flex-direction: column;
      gap: 1.5rem;
      max-width: 90%;
      padding-top: 5rem;
    }
    .text-column {
      max-width: 100%;
      font-size: 0.65rem;
    }
    .box p {
      text-align: justify;
    }
    .box h1, .box h2 {
      text-align: left;
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }
  }

  /* Toggle idioma estilo original */
  #language-toggle {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 1100;
    display: flex;
    width: 60px;
    height: 26px;
    border-radius: 20px;
    border: 2px solid #666;
    overflow: hidden;
    cursor: pointer;
    user-select: none;
    font-family: 'NeueHaasDisplay', sans-serif;
    font-weight: 600;
    font-size: 0.7rem;
    background: #000;
    box-shadow: 0 4px 8px rgba(0,0,0,0.12);
    transition: box-shadow 0.3s ease;
  }

  #language-toggle:hover {
    box-shadow: 0 6px 14px rgba(0,0,0,0.2);
  }

  #language-toggle > div {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    position: relative;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  #language-toggle .es, #language-toggle .en {
    color: #666;
    background-color: #111;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  #language-toggle::before {
    content: "";
    position: absolute;
    top: 3px;
    left: 31px; /* EN activo por defecto */
    width: 26px;
    height: 20px;
    background-color: #ccc;
    border-radius: 20px;
    transition: left 0.3s ease;
    z-index: 0;
  }

  #language-toggle.en-active .en {
    background-color: #ccc;
    color: #000;
    z-index: 1;
    position: relative;
  }
  #language-toggle.en-active .es {
    background-color: #111;
    color: #666;
    z-index: 0;
    position: relative;
  }
  #language-toggle.en-active::before {
    left: 31px;
    background-color: #ccc;
  }

  #language-toggle.es-active .es {
    background-color: #ccc;
    color: #000;
    z-index: 1;
    position: relative;
  }
  #language-toggle.es-active .en {
    background-color: #111;
    color: #666;
    z-index: 0;
    position: relative;
  }
  #language-toggle.es-active::before {
    left: 3px;
    background-color: #ccc;
  }
</style>
</head>
<body>

<div id="categories-bar">
  <a href="index.html" class="name-label">Maximiliano Vásquez</a>
  <div class="buttons-container">
    <button><a href="index.html" style="color: #ccc; text-decoration: none;">index</a></button>
    <button><a href="commercial.html" style="color: #ccc; text-decoration: none;">Commercial</a></button>
    <button class="active" aria-current="true">Info</button>
    <button><a href="https://www.instagram.com/madximiliano" target="_blank" style="color: #ccc; text-decoration: none;">follow</a></button>
  </div>
</div>

<div class="text-columns">
  <div class="text-column box">
    <h1>Selected Clients</h1>
    <p>Nike, Puma, Umbro, Fila, Hoka, New Era, Bold, Ellesse, Monarch, GAM, Pedritos Wear, Dos Lobos, Tommy Hilfiger, AdDI, Neit Whiskey, Joia Market, Melt Pizzas, Paris, Drops, Mercado Libre, Sony Music, More Amor, Partes by Lupe Gaj
